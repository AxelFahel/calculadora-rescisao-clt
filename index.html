<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Calculadora de Rescisão CLT — Estimativa Trabalhista</title>
    <meta name="description" content="Calcule de forma estimada os valores rescisórios CLT: saldo de salário, aviso prévio proporcional, 13º salário, férias, FGTS e multa. Ferramenta gratuita e 100% local." />
    <meta name="keywords" content="rescisão CLT, calculadora rescisão, aviso prévio proporcional, FGTS, 13 salário, férias proporcionais, verbas rescisórias" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:title" content="Calculadora de Rescisão CLT" />
    <meta property="og:description" content="Estimativa de verbas rescisórias trabalhistas CLT. 100% local, privado e gratuito." />
    <meta property="og:type" content="website" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <script>
      // Aplica tema escuro antes do render para evitar flash
      const theme = localStorage.getItem('theme');
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
